    :root {
      --bg: #0a1018; --surface: #121822; --border: rgba(255,255,255,.08);
      --text: #f0f2f8; --muted: #8b93a8; --accent: #0ea5e9;
      --font-display: "Outfit", system-ui, sans-serif;

    .sub { color: var(--muted); margin-bottom: 32px; }
    .app-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px 24px; margin-bottom: 12px;
    }
    .app-block h2 { font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 20px; }
    .links a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: .875rem; }
    .support-note { margin-top: 32px; color: var(--muted); font-size: .9rem; padding-top: 24px; border-top: 1px solid var(--border); }
    .support-note a { color: var(--accent); }
